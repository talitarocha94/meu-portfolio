<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9158b6"/>
      <stop offset="100%" stop-color="#f3a4c3"/>
    </linearGradient>
  </defs>
  <!-- Base arredondada com degradê que combina com o tema -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#grad)"/>
  <!-- Ponto em menta com anel suave (remete ao detalhe da marca) -->
  <circle cx="16" cy="16" r="6" fill="#66c2c7" stroke="#e7d8f2" stroke-width="4"/>
  <!-- Monograma TR (fonte de sistema) -->
  <text x="34" y="43" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">TR</text>
</svg>
